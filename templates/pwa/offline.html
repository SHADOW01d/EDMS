{% extends "base/base.html" %}

{% block title %}Offline | EDMS{% endblock %}

{% block content %}
<section class="min-vh-75 d-flex align-items-center justify-content-center text-center">
    <div class="p-4 p-md-5 rounded-4 shadow-sm bg-white" style="max-width: 36rem">
        <div class="display-3 text-success mb-3" aria-hidden="true">
            <i class="bi bi-wifi-off"></i>
        </div>
        <p class="text-uppercase text-success fw-semibold small mb-2">EDMS</p>
        <h1 class="h3 mb-3">You are currently offline</h1>
        <p class="text-secondary mb-4">
            Hatuna muunganisho wa intaneti kwa sasa. Tafadhali angalia mtandao wako
            kisha ujaribu tena.
        </p>
        <button class="btn btn-success px-4" type="button" onclick="window.location.reload()">
            <i class="bi bi-arrow-clockwise me-2" aria-hidden="true"></i>Try again
        </button>
    </div>
</section>
{% endblock %}

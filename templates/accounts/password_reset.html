{% extends "base/base_auth.html" %}
{% block title %}Reset Password | EDMS{% endblock %}
{% block auth_content %}
<div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h4 mb-2">Reset password</h1><p class="text-muted small">Enter your email address. If it matches an account, a secure reset link will be sent.</p><form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_email">Email address</label><input class="form-control" type="email" name="email" id="id_email" autocomplete="email" required></div><button class="btn btn-success w-100" type="submit">Send reset link</button></form><a class="d-block text-center small mt-3" href="{% url 'login' %}">Back to sign in</a></div></div>
{% endblock %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a3a22">
    <meta http-equiv="refresh" content="0;url=/dashboard/branch/mwanza/">
    <title>Mwanza Branch | EDMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            font-family: "Plus Jakarta Sans", sans-serif;
            color: #0b1f12;
            background: #f2f6f2;
        }
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(circle at 85% 12%, rgba(34, 197, 94, .12), transparent 28rem),
                #f2f6f2;
        }
        main {
            width: min(100%, 470px);
            padding: 36px;
            border: 1px solid #e3ebe3;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(4, 31, 17, .12);
            text-align: center;
        }
        .logo {
            width: 112px;
            height: 72px;
            margin: 0 auto 20px;
            object-fit: contain;
        }
        .eyebrow {
            color: #12693a;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0; font-size: 25px; letter-spacing: -.7px; }
        p { margin: 0; color: #708174; font-size: 13px; line-height: 1.7; }
        a {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
            padding: 0 18px;
            border-radius: 10px;
            background: linear-gradient(95deg, #16a34a, #12693a);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover { background: #0d4a2b; }
        a:focus-visible { outline: 3px solid #86efac; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/media/logo.png" alt="Effective Diet">
        <div class="eyebrow">Effective Diet Management System</div>
        <h1>Mwanza Branch</h1>
        <p>Opening the current Mwanza workspace. Sign in with an authorized branch account to continue.</p>
        <a href="/dashboard/branch/mwanza/">Open Mwanza workspace</a>
    </main>
    <script>
        window.location.replace("/dashboard/branch/mwanza/");
    </script>
</body>
</html>
